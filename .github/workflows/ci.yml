name: Codex integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: codex-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test integration and core readers
        run: bash codex/scripts/test.sh
      - name: Build standalone meter
        run: bash codex/scripts/setup.sh
